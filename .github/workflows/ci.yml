name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:4100
      PLAYWRIGHT_HTML_OUTPUT_DIR: .local/browser-reports
      PLAYWRIGHT_RESULTS_ROOT: .local/browser-results
      PLAYWRIGHT_JSON_OUTPUT_DIR: .local/browser-json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:setup
      - run: python3 scripts/github/test_project_data.py
      - run: python3 scripts/test_sprint_evidence.py
      - run: python3 scripts/test_quick_tunnel.py
      - run: python3 -m py_compile scripts/github/*.py
      - run: docker compose --env-file .env.example -f infrastructure/docker-compose.yml config --quiet
      - run: pnpm --filter @tixflow/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.local/test-reports/unit.json
      - run: pnpm test:infra:up
      - run: pnpm test:db:prepare
      - run: pnpm --filter @tixflow/api test:integration --reporter=default --reporter=json --outputFile=${{ github.workspace }}/.local/test-reports/integration.json
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: node scripts/run-browser-regression.mjs
      - run: python3 scripts/sprint_evidence.py
      - run: pnpm exec playwright test --config playwright.responsive.config.ts
      - run: pnpm test:infra:down
        if: always()
      - run: python3 scripts/setup-staging.py
      - run: python3 scripts/check-staging.py --build --down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-browser-evidence
          path: |
            playwright-report/
            test-results/
            .local/browser-reports/
            .local/browser-results/
            .local/browser-json/
            .local/test-reports/
            .local/sprint-evidence/
            .local/staging/results.json
            .local/staging/api.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
