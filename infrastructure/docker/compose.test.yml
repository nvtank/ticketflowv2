name: tixflow-v2-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tf2_test
      POSTGRES_PASSWORD: isolated_test_password
      POSTGRES_DB: tf2_test
    ports:
      - '127.0.0.1:55442:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tf2_test -d tf2_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:56392:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
