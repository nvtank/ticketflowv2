name: ticketflowv2-import-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tixflow_test
      POSTGRES_PASSWORD: tixflow_test_only
      POSTGRES_DB: tixflow_test
      TZ: UTC
    ports:
      - '127.0.0.1:55443:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tixflow_test -d tixflow_test']
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:56393:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20
